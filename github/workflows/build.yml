name: Build Android APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="acg-faka-android-native-v0.3.0.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS_FILE" || { echo "settings.gradle.kts not found in ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK_PATH" || { echo "APK not found after build"; exit 1; }
          mkdir -p output
          cp "$APK_PATH" output/app-debug.apk
          ls -lh output/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acg-faka-mobile-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 14
